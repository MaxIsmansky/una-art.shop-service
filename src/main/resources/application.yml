spring:
  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB
  application:
    name: shop-service
  profiles:
    active: ${ACTIVE_PROFILE:default}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    liquibase-schema: ${LIQUIBASE_SCHEMA:liquibase-schema}

logging:
  level:
    org:
      hibernate: ${HIBERNATE_LOG_LEVEL:INFO}

s3:
  region: "ru-central1"
  url: ${S3_URL}
  credentials:
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_ACCESS_KEY}

server:
  port: ${SERVER_PORT:8080}
